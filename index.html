<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <title>Watania Steel — Factory workspace</title>
    <meta name="description" content="Al Watania Steel factory workspace. Manage orders, materials, inventory and deliveries in Qatar." />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Apply a saved preference before the first paint. New visits use light.
      try {
        document.documentElement.classList.toggle('light', localStorage.getItem('theme') !== 'dark');
      } catch {
        // Keep the light default when browser storage is unavailable.
      }
    </script>
    <meta name="theme-color" content="#232824" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
