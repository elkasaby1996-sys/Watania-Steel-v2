name: Supabase Repair Legacy Migrations

on:
  workflow_dispatch:

jobs:
  repair:
    name: Mark legacy migrations as applied
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            missing=1
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing GitHub secret: SUPABASE_PROJECT_ID"
            missing=1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing GitHub secret: SUPABASE_DB_PASSWORD"
            missing=1
          fi

          exit "$missing"

      - name: Initialize Supabase config if needed
        run: test -f supabase/config.toml || supabase init

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Mark legacy migrations as applied
        run: |
          supabase migration repair \
            20250923 \
            20250924 \
            20250925 \
            20250926 \
            20250927 \
            20250928 \
            20260218 \
            20260219 \
            20260503124413 \
            20260503133000 \
            20260504120000 \
            --status applied

      - name: Remove ambiguous 20260503 repair record
        run: supabase migration repair 20260503 --status reverted

      - name: Confirm migration history
        run: supabase migration list

      - name: Confirm dry run is clean
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
