name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy-supabase:
    name: Deploy Supabase migrations
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_MIGRATIONS_BOOTSTRAPPED: ${{ secrets.SUPABASE_MIGRATIONS_BOOTSTRAPPED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Supabase changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "supabase_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi
          echo "$changed_files"

          if echo "$changed_files" | grep -q '^supabase/'; then
            echo "supabase_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when Supabase is unchanged
        if: steps.changes.outputs.supabase_changed != 'true'
        run: echo "No Supabase files changed; skipping database migration deploy."

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.supabase_changed == 'true'
        with:
          version: latest

      - name: Validate migration deployment secrets
        if: steps.changes.outputs.supabase_changed == 'true'
        shell: bash
        run: |
          missing=0

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            missing=1
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing GitHub secret: SUPABASE_PROJECT_ID"
            missing=1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing GitHub secret: SUPABASE_DB_PASSWORD"
            missing=1
          fi

          if [ "$SUPABASE_MIGRATIONS_BOOTSTRAPPED" != "true" ]; then
            echo "Set SUPABASE_MIGRATIONS_BOOTSTRAPPED=true only after legacy migration history has been repaired."
            missing=1
          fi

          exit "$missing"

      - name: Initialize Supabase config if needed
        if: steps.changes.outputs.supabase_changed == 'true'
        run: test -f supabase/config.toml || supabase init

      - name: Link Supabase project
        if: steps.changes.outputs.supabase_changed == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run migrations
        if: steps.changes.outputs.supabase_changed == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: steps.changes.outputs.supabase_changed == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
