name: Supabase Dry Run

on:
  workflow_dispatch:

jobs:
  dry-run:
    name: Dry run Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            missing=1
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing GitHub secret: SUPABASE_PROJECT_ID"
            missing=1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing GitHub secret: SUPABASE_DB_PASSWORD"
            missing=1
          fi

          exit "$missing"

      - name: Initialize Supabase config if needed
        run: test -f supabase/config.toml || supabase init

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
